mail:
  signup:
    subject: "[Wellness] 회원가입 인증번호입니다."
    context: |
      <div style="font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 600px; margin: 0 auto; padding: 30px; border: 1px solid #e5e7eb; border-radius: 12px; background-color: #ffffff;">
          <h2 style="color: #111827; font-size: 20px; margin-bottom: 24px;">[Wellness] 회원가입 인증번호 안내</h2>
          <p style="color: #374151; font-size: 15px; line-height: 1.6; margin-bottom: 16px;">안녕하세요.</p>
          <p style="color: #374151; font-size: 15px; line-height: 1.6; margin-bottom: 24px;">Wellness 회원가입을 위한 인증번호를 안내해 드립니다.</p>
          <div style="background-color: #f3f4f6; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 24px;">
              <span style="font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #2563eb;">{authCode}</span>
          </div>
          <p style="color: #6b7280; font-size: 13px; line-height: 1.5; margin-bottom: 0;">인증번호는 <strong>3분간</strong> 유효합니다. 본인이 요청하지 않은 경우 이 메일을 무시해 주세요.</p>
      </div>