name: Deploy Spring boot App

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Verify Build output
        run: |
          if ! ls build/libs/*.jar > /dev/null 2>&1; then
            echo "빌드 실패: JAR 파일을 찾을 수 없습니다."
            exit 1
          fi
          echo "빌드 성공: JAR 파일이 생성되었습니다."
          ls -lh build/libs/*.jar

      - name: Deploy Boot App to EC2
        run: |
          cp build/libs/*.jar /home/ubuntu/app/backend/wellness.jar

      - name: Restart Container
        run: |
          cd /home/ubuntu/app
          docker compose restart api

      - name: Send Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: "#wellness-cicd"
          message: |
            🚀 Backend CI/CD

            저장소: ${{ github.repository }}
            브랜치: ${{ github.ref_name }}
            커밋ID: ${{ github.sha }}
            작성자: ${{ github.actor }}
            상태: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
